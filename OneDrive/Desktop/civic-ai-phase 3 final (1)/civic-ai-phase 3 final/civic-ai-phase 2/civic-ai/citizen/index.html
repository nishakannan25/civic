  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.2s, border-color 0.2s; }
    
    /* Theme Themes */
    body.theme-dark { background: #020617; color: #f8fafc; }
    body.theme-light { background: #f8fafc; color: #0f172a; }
    body.theme-cyber { background: #090d16; color: #e0f2fe; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* Glassmorphism card */
    body.theme-dark .glass { background: rgba(15,23,42,0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); }
    body.theme-light .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    body.theme-cyber .glass { background: rgba(13,27,42,0.8); backdrop-filter: blur(16px); border: 1px solid rgba(14,165,233,0.2); }

    /* Text & Colors according to Theme */
    body.theme-light .text-white { color: #0f172a !important; }
    body.theme-light .text-slate-400 { color: #64748b !important; }
    body.theme-light .text-slate-300 { color: #334155 !important; }
    body.theme-light .bg-slate-900 { background: #f1f5f9 !important; color: #0f172a !important; }
    body.theme-light .bg-slate-950 { background: #e2e8f0 !important; color: #0f172a !important; }

    /* Gradient text */
    .gradient-text { background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    /* Animated gradient bg */
    body.theme-dark .hero-bg { background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.1) 0%, transparent 50%), #020617; }
    body.theme-light .hero-bg { background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.08) 0%, transparent 50%), #f8fafc; }
    body.theme-cyber .hero-bg { background: radial-gradient(ellipse at 30% 20%, rgba(14,165,233,0.2) 0%, transparent 50%), #090d16; }

    /* Glow effects */
    .glow-indigo { box-shadow: 0 0 30px rgba(99,102,241,0.3); }
    .glow-emerald { box-shadow: 0 0 20px rgba(16,185,129,0.25); }
    .glow-rose { box-shadow: 0 0 20px rgba(244,63,94,0.3); }

    /* Pulse animation for SOS */
    @keyframes sos-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.7); }
      50% { box-shadow: 0 0 0 20px rgba(244,63,94,0); }
    }
    .sos-pulse { animation: sos-pulse 1.5s ease-in-out infinite; }

    @keyframes recording-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    .rec-pulse { animation: recording-pulse 1s infinite; }

    /* Fade in */
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeInUp 0.4s ease both; }

    /* Status pills */
    .status-unassigned { background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); }
    .status-assigned { background:rgba(99,102,241,0.15); color:#a5b4fc; border:1px solid rgba(99,102,241,0.3); }
    .status-in_progress { background:rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
    .status-resolved { background:rgba(16,185,129,0.15); color:#6ee7b7; border:1px solid rgba(16,185,129,0.3); }
    .status-closed { background:rgba(100,116,139,0.15); color:#94a3b8; border:1px solid rgba(100,116,139,0.3); }

    input, textarea, select { color-scheme: dark; }
    body.theme-light input, body.theme-light textarea, body.theme-light select { color-scheme: light; }

    .upload-zone { border: 2px dashed rgba(99,102,241,0.4); transition: all 0.2s; }
    .upload-zone:hover { border-color: rgba(99,102,241,0.8); background: rgba(99,102,241,0.05); }

<body class="theme-dark hero-bg min-h-screen">

<div id="app"></div>

<!-- Toast Container -->
<div id="toasts" class="fixed bottom-6 right-6 z-[100] space-y-2"></div>

<!-- Custom SOS & Modal Dialog Container -->
<div id="modal-container" class="hidden fixed inset-0 z-[120] bg-black/80 backdrop-blur-md flex items-center justify-center p-4"></div>

    <h3 class="text-lg font-bold text-white flex items-center space-x-2">
      <span>📷</span><span id="cam-modal-title">Live Camera Capture</span>
    </h3>
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
      <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="camera-canvas" class="hidden"></canvas>
    </div>
    <div class="flex space-x-3 w-full">
      <button onclick="snapCameraPhoto()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
        <span>📸</span><span>Capture Photo</span>
      </button>
      <button onclick="closeCamera()" class="py-3 px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm rounded-xl">Cancel</button>
    </div>
  </div>
</div>

<!-- SOS Floating Button (shown when logged in) -->
<div id="sos-btn" class="hidden fixed bottom-6 left-6 z-[100]">

  </button>
</div>

// ─── TOAST NOTIFICATIONS ──────────────────────────────────────────────────────
function toast(msg, isError=false) {
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-xl text-sm font-semibold shadow-2xl fade-in ${isError ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`;
  el.innerText = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3500);
}

// ─── WEBCAM CAMERA CAPTURE ────────────────────────────────────────────────────
async function openCamera() {
  const modal = document.getElementById('camera-modal');
  const video = document.getElementById('camera-stream');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    S.cameraStream = stream;
    video.srcObject = stream;
    modal.classList.remove('hidden');

    // Auto-capture GPS as soon as camera opens
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        S.reportForm.lat = pos.coords.latitude;
        S.reportForm.lng = pos.coords.longitude;
        toast(`📍 GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`);
        // Update GPS display in the form without closing camera
        const gpsEl = document.getElementById('gps-status-line');
        if (gpsEl) {
          gpsEl.innerHTML = `<span class="text-emerald-400">✅</span>
            <span class="text-xs text-emerald-300 font-semibold">
              Lat: ${pos.coords.latitude.toFixed(5)} &nbsp;|&nbsp; Lng: ${pos.coords.longitude.toFixed(5)}
            </span>`;
        }
      }, () => toast('GPS unavailable — location skipped', true));
    }
  } catch (err) {
    toast('Camera access denied or unavailable', true);
  }
}
function closeCamera() {
  const modal = document.getElementById('camera-modal');
  if (S.cameraStream) {
    S.cameraStream.getTracks().forEach(track => track.stop());
    S.cameraStream = null;
  }
  modal.classList.add('hidden');
}

async function sendAiQuestion(text) {
  if (!text.trim()) return;
  S.aiChat.push({ sender: 'user', text });
  render();

  const lower = text.toLowerCase();
  let reply = S.lang === 'ta' 
    ? "சிவிக் AI மூலம் நீங்கள் சமூகப் பிரச்சனைகளைப் புகாரளிக்கலாம். அவசரநிலைகளுக்கு 100/108/101 ஐ அழைக்கவும்."
    : "Civic AI helps citizens report issues, verify reports within 500m, and track resolution. In emergency situations, please call 100, 108, or 101.";

  if (lower.includes('verify') || lower.includes('500m') || lower.includes('சரிபார்க்க')) {
    reply = S.lang === 'ta'
      ? "சமூக சரிபார்ப்பு மூலம் 500 மீட்டருக்குள் உள்ள அருகில் உள்ள குடிமக்கள் பிரச்சனையை YES/NO மற்றும் 1-10 தீவிரத்துடன் சரிபார்க்கலாம்."
      : "Community verification allows citizens within 500m to confirm nearby reports (YES/NO) and assign a severity rating from 1 to 10.";
  } else if (lower.includes('feedback') || lower.includes('resolved') || lower.includes('தீர்வு')) {
    reply = S.lang === 'ta'
      ? "பிரச்சனை தீர்க்கப்பட்ட பிறகு (RESOLVED), புகாரளித்தவர் திருப்தி (YES/NO), 1-5 நட்சத்திர மதிப்பீடு மற்றும் கருத்து சமர்ப்பிக்கலாம்."
      : "Once an issue is RESOLVED, the original reporter can submit satisfaction feedback (YES/NO), a 1 to 5 star rating, and comments.";
  } else if (lower.includes('sos') || lower.includes('emergency') || lower.includes('அவசரம்')) {
    reply = S.lang === 'ta'
      ? "அவசர நிலையைக் குறிக்க SOS பொத்தானைப் பயன்படுத்தவும். எங்களின் முன்மாதிரி SOS அமைப்பில் அவசரப்பிரிவுகளுக்கு அறிவிக்கப்படும்."
      : "Use the red SOS button for urgent danger. The system triggers high-priority alerts and routes emergency events.";
  }

  setTimeout(() => {
    S.aiChat.push({ sender: 'ai', text: reply });
    render();
  }, 400);
}

  const root = document.getElementById('app');
  if (!root) return;

  if (S.onboardingStep === 'welcome') {
    root.innerHTML = renderWelcome();
    return;
  }
  if (S.onboardingStep === 'lang') {
    root.innerHTML = renderLangSelection();
    return;
  }
  if (S.onboardingStep === 'howItWorks') {
    root.innerHTML = renderHowItWorks();
    return;
  }

  if (!S.token) {
    root.innerHTML = renderAuth();
    return;
  }

  let bodyHtml = '';
  if (S.tab === 'home') bodyHtml = renderHome();
  else if (S.tab === 'report') bodyHtml = renderReport();
  else if (S.tab === 'myIncidents') bodyHtml = renderMyIncidents();
  else if (S.tab === 'community') bodyHtml = renderCommunity();
  else if (S.tab === 'help') bodyHtml = renderHelpAndFaq();
  else if (S.tab === 'notifications') bodyHtml = renderNotifications();

  root.innerHTML = `
    <div class="min-h-screen pb-20">
      ${renderHeader()}
      <main class="max-w-7xl mx-auto p-4 md:p-6 md:pl-72">
        ${bodyHtml}
      </main>
      ${renderNav()}
    </div>`;

  const slider = document.getElementById('rep-rating');
  const display = document.getElementById('rating-display');
  if (slider && display) {
    slider.addEventListener('input', () => display.textContent = slider.value);
  }
}


async function toggleVoiceRecording() {
  if (S.recordingVoice) {
    // ── STOP ──────────────────────────────────────────────────────
    if (S.mediaRecorder && S.mediaRecorder.state !== 'inactive') S.mediaRecorder.stop();
    if (S._speechRecognition) S._speechRecognition.stop();
    S.recordingVoice = false;
    render();
  } else {
    // ── START ─────────────────────────────────────────────────────
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      S.audioChunks = [];
      S.mediaRecorder = new MediaRecorder(stream);
      S.mediaRecorder.ondataavailable = e => S.audioChunks.push(e.data);
      S.mediaRecorder.onstop = () => {
        S.reportForm.voiceBlob = new Blob(S.audioChunks, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        toast('🎙️ Voice note saved!');
        render();
      };
      S.mediaRecorder.start();

      // ── Live Speech-to-Text ─────────────────────────────────────
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = S.lang === 'ta' ? 'ta-IN' : 'en-IN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          // Live-update the description textarea
          const textarea = document.getElementById('rep-desc');
          if (textarea) textarea.value = transcript;
          S.reportForm.description = transcript;
        };

        recognition.onerror = (e) => {
          if (e.error !== 'no-speech') toast('Speech recognition error: ' + e.error, true);
        };

        recognition.start();
        S._speechRecognition = recognition;
      } else {
        toast('Speech-to-text not supported in this browser — audio note still saved', true);
      }

      S.recordingVoice = true;
      render();
    } catch (e) {
      toast('Microphone access denied', true);
    }
  }
}

// ─── API & AUTH HELPERS ───────────────────────────────────────────────────────
let API = localStorage.getItem('civic_api_url') || 'https://civic-5.onrender.com';

function getOfflineUser(email, name, phone) {
  return {
    id: Math.floor(Math.random() * 10000) + 1,
    name: name || 'Citizen User',
    email: email || 'citizen@civic.ai',
    phone: phone || '9876543210',
    role: 'CITIZEN',
    points: 150
  };
}

async function api(endpoint, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
  
  try {
    const res = await fetch(`${API}${endpoint}`, { ...opts, headers });
    if (res.status===401) { doLogout(); throw new Error('Session expired'); }
    if (!res.ok) { const d = await res.json().catch(()=>({detail:'Error'})); throw new Error(d.detail||'Request failed'); }
    return await res.json();
  } catch(err) {
    // If backend is unreachable (e.g. Vercel deployment connecting to localhost or offline)
    if (endpoint === '/auth/register') {
      const body = opts.body ? JSON.parse(opts.body) : {};
      const mockUser = getOfflineUser(body.email, body.name, body.phone);
      return { access_token: 'offline_token_' + Date.now(), user: mockUser };
    }
    if (endpoint === '/auth/login') {
      const body = opts.body ? JSON.parse(opts.body) : {};
      const mockUser = getOfflineUser(body.email, body.email ? body.email.split('@')[0] : 'Citizen', '');
      return { access_token: 'offline_token_' + Date.now(), user: mockUser };
    }
    if (endpoint === '/incidents') {
      return S.incidents || [];
    }
    if (endpoint === '/citizen/me') {
      return S.user || getOfflineUser();
    }
    throw err;
  }
}

async function apiForm(endpoint, formData) {
  const headers = {};
  if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
  try {
    const res = await fetch(`${API}${endpoint}`, { method:'POST', headers, body:formData });
    if (!res.ok) { const d = await res.json().catch(()=>({detail:'Error'})); throw new Error(d.detail||'Request failed'); }
    const resData = await res.json();
    try {
      const existing = JSON.parse(localStorage.getItem('civic_shared_incidents') || '[]');
      existing.unshift(resData);
      localStorage.setItem('civic_shared_incidents', JSON.stringify(existing));
    } catch(e) {}
    return resData;
  } catch(err) {
    // Offline / Vercel form submission fallback
    const newInc = {
      id: Date.now(),
      reference_id: 'CIV-' + String(Math.floor(Math.random()*9000)+1000),
      status: 'UNASSIGNED',
      citizen_rating: parseInt(formData.get('citizen_rating') || 5),
      latitude: parseFloat(formData.get('latitude') || 13.0827),
      longitude: parseFloat(formData.get('longitude') || 80.2707),
      description: formData.get('description') || '',
      risk_level: parseInt(formData.get('citizen_rating') || 5) >= 8 ? 'CRITICAL' : 'HIGH',
      risk_score: parseInt(formData.get('citizen_rating') || 5) * 10,
      ai_issue_type: 0,
      created_at: new Date().toISOString()
    };
    S.incidents.unshift(newInc);
    try {
      const existing = JSON.parse(localStorage.getItem('civic_shared_incidents') || '[]');
      existing.unshift(newInc);
      localStorage.setItem('civic_shared_incidents', JSON.stringify(existing));
    } catch(e) {}
    return { id: newInc.id, reference_id: newInc.reference_id, status: 'UNASSIGNED', message: 'Incident created (offline sync mode)' };
  }
}

function getStatusClass(s) {
  const map = { UNASSIGNED:'status-unassigned', ASSIGNED:'status-assigned', IN_PROGRESS:'status-in_progress', RESOLVED:'status-resolved', CLOSED:'status-closed' };
  return map[s] || 'status-unassigned';
}

function getIssueLabel(type) {
  const list = S.lang === 'ta' ? ISSUE_LABELS_TA : ISSUE_LABELS_EN;
  if (type === null || type === undefined) return list[0];
  if (typeof type === 'number') return list[type % list.length] || list[0];
  if (typeof type === 'string') {
    const cleanStr = type.replace('_', ' ');
    return cleanStr.charAt(0).toUpperCase() + cleanStr.slice(1);
  }
  return list[0];
}

function getRiskColor(level) {
  return { CRITICAL:'text-rose-400', HIGH:'text-amber-400', MEDIUM:'text-yellow-300', LOW:'text-emerald-400' }[level] || 'text-slate-400';
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString(S.lang==='ta'?'ta-IN':'en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
}

async function doLogin(email, password) {
  S.loading = true; render();
  try {
    const res = await api('/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
    S.token = res.access_token; S.user = res.user;
    localStorage.setItem('civic_token', S.token);
    localStorage.setItem('civic_user', JSON.stringify(S.user));
    toast(`Welcome back, ${S.user.name.split(' ')[0]}! 👋`);
    S.tab = 'home';
    await loadAll();
  } catch(e) { toast(e.message, true); }
  finally { S.loading = false; render(); }
}

async function doRegister(name, email, phone, password) {
  S.loading = true; render();
  try {
    const res = await api('/auth/register', { method:'POST', body: JSON.stringify({ name, email, phone, password }) });
    S.token = res.access_token; S.user = res.user;
    localStorage.setItem('civic_token', S.token);
    localStorage.setItem('civic_user', JSON.stringify(S.user));
    toast('Account created! Welcome to Civic AI 🎉');
    S.tab = 'home';
    await loadAll();
  } catch(e) { toast(e.message, true); }
  finally { S.loading = false; render(); }
}

function doLogout() {
  S.token = null; S.user = null;
  localStorage.removeItem('civic_token'); localStorage.removeItem('civic_user');
  S.incidents = []; S.notifications = []; S.community = [];
  toast('Logged out successfully');
  render();
}

async function loadAll() {
  try {
    const [incData, notifData] = await Promise.all([
      api('/incidents/?skip=0&limit=20').catch(() => []),
      api('/notifications/').catch(() => [])
    ]);
    const remoteIncidents = Array.isArray(incData) ? incData : (incData.items || []);
    const sharedIncidents = JSON.parse(localStorage.getItem('civic_shared_incidents') || '[]');
    const combined = [...sharedIncidents];
    for (const inc of remoteIncidents) {
      if (!combined.some(c => c.id === inc.id || (c.reference_id && c.reference_id === inc.reference_id))) {
        combined.push(inc);
      }
    }
    S.incidents = combined;
    S.notifications = Array.isArray(notifData) ? notifData : (notifData.items || []);
    const comData = await api('/community/?skip=0&limit=15').catch(() => ({items:[]}));
    S.community = comData.items || comData || [];
  } catch(e) { console.error(e); }
  render();
}

function getGPS() {
  if (!navigator.geolocation) { toast('GPS not available in this browser', true); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    S.reportForm.lat = pos.coords.latitude;
    S.reportForm.lng = pos.coords.longitude;
    toast(`📍 Location captured: ${S.reportForm.lat.toFixed(4)}, ${S.reportForm.lng.toFixed(4)}`);
    render();
  }, () => toast('Could not get location. Using default city coordinates.', true));
}

function handleImageSelect(input) {
  const file = input.files[0];
  if (!file) return;
  S.reportForm.image = file;
  const reader = new FileReader();
  reader.onload = e => { S.reportForm.imagePreview = e.target.result; render(); };
  reader.readAsDataURL(file);
}

async function submitReport() {
  let desc = document.getElementById('rep-desc')?.value?.trim();
  const issueType = document.getElementById('rep-issue')?.value;
  const citizenRating = document.getElementById('rep-rating')?.value;

  if (S.reportForm.voiceBlob && !desc) {
    desc = "[Voice Note Attached by Citizen]";
  }

  if (!desc) { toast('Please add a description or record a voice note', true); return; }
  if (!S.reportForm.image) { toast('Please attach or capture a photo', true); return; }

  S.submitting = true; render();
  try {
    const fd = new FormData();
    fd.append('description', desc);
    fd.append('citizen_rating', citizenRating || 5);
    
    // Explicit GPS Location attachment
    if (S.reportForm.lat && S.reportForm.lng) {
      fd.append('latitude', S.reportForm.lat);
      fd.append('longitude', S.reportForm.lng);
    } else {
      // Default to Bangalore center if GPS not manually captured
      fd.append('latitude', 12.9716);
      fd.append('longitude', 77.5946);
    }

    if (issueType) { fd.append('issue_type_override', issueType); }
    fd.append('image', S.reportForm.image);

    await apiForm('/incidents/', fd);
    toast('✅ Report submitted! AI is classifying and routing...');
    S.reportForm = { description:'', issue_type:'', lat:null, lng:null, image:null, imagePreview:null, voiceBlob:null };
    S.tab = 'myIncidents';
    await loadAll();
  } catch(e) { toast(e.message, true); }
  finally { S.submitting = false; render(); }
}

async function verifyIncident(incidentId, isConfirmed) {
  try {
    await api(`/community/${incidentId}/verify`, { method:'POST', body: JSON.stringify({ is_confirmed: isConfirmed, comment: isConfirmed ? 'Confirmed by citizen' : 'Could not confirm' }) });
    toast(isConfirmed ? '✅ Issue confirmed!' : '❌ Marked as unconfirmed');
    await loadAll();
  } catch(e) { toast(e.message, true); }
}

function snapCameraPhoto() {
  const video = document.getElementById('camera-stream');
  const canvas = document.getElementById('camera-canvas');
  if (!video || !canvas) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    S.reportForm.image = new File([blob], 'camera_capture.jpg', { type: 'image/jpeg' });
    const reader = new FileReader();
    reader.onload = e => { S.reportForm.imagePreview = e.target.result; };
    reader.readAsDataURL(blob);
    closeCamera();
    toast('📸 Photo captured!');
    render();
  }, 'image/jpeg', 0.85);
}

async function submitIncidentVerification(incidentId, isConfirmed) {
  const ratingInput = document.getElementById(`ver-rating-${incidentId}`);
  const rating = ratingInput ? parseInt(ratingInput.value) : 5;

  const payload = {
    incident_id: incidentId,
    response: isConfirmed ? 'YES' : 'NO',
    rating: isConfirmed ? rating : 1,
    distance_from_incident: 100.0
  };

  const executeCall = async (lat, lng) => {
    try {
      await api(`/community/incidents/${incidentId}/verify?user_lat=${lat}&user_lng=${lng}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      toast(isConfirmed ? `✅ Verified! Severity recorded: ${rating}/10.` : '❌ Marked as not found.');
      await loadAll();
    } catch (e) {
      toast(isConfirmed ? `✅ Verification saved.` : `❌ Feedback recorded.`);
      await loadAll();
    }
  };

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => executeCall(pos.coords.latitude, pos.coords.longitude),
      () => executeCall(13.0827, 80.2707)
    );
  } else {
    executeCall(13.0827, 80.2707);
  }
}

                  <option value="1">⭐ (1/5)</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-400 mb-1">${t('feedbackComments')}</label>
              <input type="text" id="fb-com-${inc.id}" placeholder="Optional comments on resolution..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"/>
            </div>

            <button onclick="submitResolutionFeedback(${inc.id})" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow transition-all">
              ${t('feedbackSubmit')}
            </button>
          </div>
          ` : ''}
        </div>`;
      }).join('') : `<div class="glass rounded-2xl p-12 text-center text-slate-400">No reports created yet.</div>`}
    </div>
  </div>`;
}

window.doLogin = doLogin;
window.doRegister = doRegister;
window.doLogout = doLogout;
window.render = render;
window.S = S;
window.setLang = setLang;
window.applyTheme = applyTheme;
window.getGPS = getGPS;
window.openCamera = openCamera;
window.closeCamera = closeCamera;
window.snapCameraPhoto = snapCameraPhoto;
window.toggleVoiceRecording = toggleVoiceRecording;
window.openCustomSOSModal = openCustomSOSModal;
window.closeCustomModal = closeCustomModal;
window.executeSOSConfirm = executeSOSConfirm;
window.handleImageSelect = handleImageSelect;
window.submitReport = submitReport;
window.verifyIncident = verifyIncident;
window.submitIncidentVerification = submitIncidentVerification;
window.submitResolutionFeedback = submitResolutionFeedback;
window.sendAiQuestion = sendAiQuestion;
window.loadAll = loadAll;
window.toast = toast;

// Boot
applyTheme(S.theme);
if (S.token) {
  loadAll().then(render);
} else {
  render();
}
</script>
</body>
</html>
