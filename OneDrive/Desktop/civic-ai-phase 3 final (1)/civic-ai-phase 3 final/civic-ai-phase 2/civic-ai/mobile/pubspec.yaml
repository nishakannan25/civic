name: civic_ai
description: "Civic AI – Intelligent Community Emergency & Civic Problem Reporting System"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # Phase 2: Camera
  camera: ^0.10.5+9

  # Phase 2: Location / GPS
  geolocator: ^11.0.0

  # Phase 2: Runtime permissions (camera + location)
  permission_handler: ^11.3.1

  # Phase 2: Image picking (fallback for simulator / gallery)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
